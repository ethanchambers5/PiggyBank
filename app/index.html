<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Piggy Bank</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky week header, fixed bottom tab bar, slide-up sheet for adding/editing. */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --sunk: #F3EAEC;
  --ink: #2A1B22;
  --muted: #7C6870;
  --line: #EADDE1;
  --accent: #D9466F;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE1E8;
  --ok: #1F8A5B;
  --ok-soft: #DDF2E7;
  --warn: #B86E00;
  --warn-soft: #FCEBCF;
  --over: #C62828;
  --over-soft: #FBDCDC;
  --c-groceries: #2E9E6A;
  --c-dining: #E0712B;
  --c-coffee: #8B5A3C;
  --c-transport: #2F7BD8;
  --c-shopping: #9B4FD1;
  --c-fun: #D9466F;
  --c-bills: #4A5A6A;
  --c-other: #A09098;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 18px;
  --shadow: 0 1px 2px rgba(42,27,34,.06), 0 6px 20px rgba(42,27,34,.06);
}
/* Always light: the app keeps its white background even when the phone is in dark mode. */
:root, :root[data-theme="dark"] { color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -.02em; margin: 0; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.demo-tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
.weekbar { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.weekbar button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; font-size: 18px; }
.weekbar button:hover:not(:disabled) { background: var(--sunk); }
.weekbar button:disabled { opacity: .3; cursor: default; }
.weekbar .label { text-align: center; line-height: 1.2; }
.weekbar .label b { display: block; font-weight: 700; font-size: 14px; }
.weekbar .label span { font-size: 12px; color: var(--muted); }

/* Sections */
main { display: grid; gap: 18px; padding-top: 6px; }
.section { display: grid; gap: 10px; }
.section h2 { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -.01em; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.section h2 small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 16px; }

/* Hero */
.hero { padding: 18px 18px 16px; display: grid; gap: 12px; }
.hero .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero .big { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -.03em; }
.hero .big .of { font-family: var(--font-body); font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.hero-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.meter { position: relative; height: 12px; background: var(--sunk); border-radius: 999px; overflow: visible; }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--ok); max-width: 100%; transition: width .3s, background-color .3s; }
@media (prefers-reduced-motion: reduce) { .meter .fill { transition: none; } }
.meter .pace { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 2px; opacity: .55; }
.hero .foot { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.over { color: var(--over); background: var(--over-soft); }

/* Alerts */
.alerts { display: grid; gap: 8px; }
.alert { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; font-size: 14px; }
.alert.over { background: var(--over-soft); color: var(--ink); }
.alert.warn { background: var(--warn-soft); color: var(--ink); }
.alert .mark { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; flex: none; color: var(--bg); }
.alert.over .mark { background: var(--over); }
.alert.warn .mark { background: var(--warn); }
.alert p { margin: 0; min-width: 0; }
.alert b { font-weight: 700; }

/* Category bars */
.cats { display: grid; }
.cat-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: center; }
.cat-row:first-child { border-top: 0; }
.cat-name { display: flex; align-items: center; gap: 10px; font-weight: 600; min-width: 0; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.cat-amt { text-align: right; font-weight: 700; }
.cat-amt small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.bar { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; }

/* Transactions */
.day { display: grid; gap: 6px; }
.day h3 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.tx-list { display: grid; }
.tx { display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 11px 14px; }
.tx:first-child { border-top: 0; }
.tx:hover { background: var(--sunk); }
.tx-list .tx:first-child { border-top-left-radius: var(--r); border-top-right-radius: var(--r); }
.tx-list .tx:last-child { border-bottom-left-radius: var(--r); border-bottom-right-radius: var(--r); }
.tx-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; color: #fff; }
.tx-main { min-width: 0; }
.tx-main b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-main span { font-size: 12.5px; color: var(--muted); }
.tx-amt { font-weight: 700; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* Budgets */
.budget-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; padding: 14px 16px; border-top: 1px solid var(--line); align-items: center; }
.budget-row:first-child { border-top: 0; }
.budget-row .meta { font-size: 13px; color: var(--muted); }
.budget-input { display: flex; align-items: center; gap: 4px; background: var(--sunk); border-radius: 10px; padding: 0 10px; border: 1px solid transparent; }
.budget-input:focus-within { border-color: var(--accent); }
.budget-input input { width: 64px; border: 0; background: transparent; padding: 8px 0; text-align: right; font-weight: 700; outline: none; }
.budget-input span { color: var(--muted); font-size: 13px; }
.totals { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 700; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 8px 0; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

/* Trends chart */
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.avg-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.avg-table th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; text-align: right; padding: 10px 12px 6px; }
.avg-table th:first-child, .avg-table td:first-child { text-align: left; }
.avg-table td { padding: 10px 12px; border-top: 1px solid var(--line); text-align: right; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding-inline: 8px; }
.tab { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 10px 0 8px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.add-btn { justify-self: center; width: 52px; height: 52px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: -18px; box-shadow: 0 6px 18px rgba(217,70,111,.35); }
.add-btn svg { width: 26px; height: 26px; }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(20,10,15,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; max-height: 92%; overflow: auto; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px; font-size: 16px; }
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
.amount-input { font-family: var(--font-display); font-weight: 700; font-size: 28px !important; }
.guess { font-size: 13px; color: var(--muted); min-height: 1.2em; }
.guess b { color: var(--ink); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; gap: 10px; }
.btn { flex: 1; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 16px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--sunk); }
.btn.danger { background: var(--over-soft); color: var(--over); flex: 0 0 auto; padding-inline: 18px; }
.err { color: var(--over); font-size: 13px; margin: 0; }

/* Import */
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 14px; }
.banner p { margin: 0; flex: 1; min-width: 0; }
.btn.small { flex: 0 0 auto; padding: 9px 14px; font-size: 14px; border-radius: 12px; }
.import-cta { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; }
.import-cta:hover { background: var(--sunk); }
.import-cta b { display: block; }
.import-cta span { font-size: 13px; color: var(--muted); }
.import-cta .ico { width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.drop { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 20px 16px; border: 2px dashed var(--line); border-radius: 16px; cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop b { color: var(--accent); }
.drop span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.vh:focus-visible + .drop { outline: 2px solid var(--accent); outline-offset: 2px; }
.map { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.map .field { min-width: 0; }
.map .field select { padding: 10px; font-size: 15px; min-width: 0; }
.import-sum { padding: 12px 14px; border-radius: 14px; background: var(--sunk); font-size: 14px; }
.import-sum b { font-weight: 700; }
.preview { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.preview .pv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 14px; }
.preview .pv:first-child { border-top: 0; }
.preview .pv b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.preview .pv small { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.preview .more { padding: 8px 12px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); flex: none; }
.btn:disabled { opacity: .45; cursor: default; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; white-space: nowrap; }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <ellipse cx="16" cy="18" rx="12" ry="9.5" fill="var(--accent)"/>
          <path d="M9 11 L8 5.5 L13 9.5 Z" fill="var(--accent)"/>
          <rect x="13" y="8.5" width="6" height="2" rx="1" fill="var(--ink)"/>
          <ellipse cx="27" cy="18.5" rx="3" ry="2.6" fill="var(--accent)" stroke="var(--bg)" stroke-width="1"/>
          <circle cx="26.2" cy="18.5" r=".6" fill="var(--ink)"/><circle cx="27.8" cy="18.5" r=".6" fill="var(--ink)"/>
          <circle cx="21" cy="15.5" r="1.1" fill="var(--ink)"/>
          <rect x="9" y="25" width="3" height="4" rx="1" fill="var(--accent)"/><rect x="19" y="25" width="3" height="4" rx="1" fill="var(--accent)"/>
        </svg>
        Piggy Bank
      </h1>
      <span class="demo-tag" id="demoTag" title="These are made-up transactions for trying the app">Demo data</span>
    </div>
    <div class="weekbar" id="weekbar">
      <button type="button" id="prevWeek" aria-label="Previous week">‹</button>
      <div class="label"><b id="weekTitle">This week</b><span id="weekRange" class="num"></span></div>
      <button type="button" id="nextWeek" aria-label="Next week">›</button>
    </div>
  </header>

  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="inner">
    <button class="tab" type="button" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home
    </button>
    <button class="tab" type="button" data-tab="activity">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Spending
    </button>
    <button class="add-btn" type="button" id="addBtn" aria-label="Add a purchase">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" type="button" data-tab="budgets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Budgets
    </button>
    <button class="tab" type="button" data-tab="trends">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Trends
    </button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="txForm" novalidate>
    <h2 id="sheetTitle">Add a purchase</h2>
    <div class="field">
      <label for="fAmount">Amount</label>
      <input id="fAmount" class="amount-input num" inputmode="decimal" placeholder="$0.00" autocomplete="off">
    </div>
    <div class="field">
      <label for="fMerchant">Where</label>
      <input id="fMerchant" placeholder="e.g. Starbucks, Shell, Amazon" autocomplete="off">
      <div class="guess" id="guess"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="fCat">Category</label>
        <select id="fCat"></select>
      </div>
      <div class="field">
        <label for="fDate">Date</label>
        <input id="fDate" type="date">
      </div>
    </div>
    <p class="err" id="formErr" hidden></p>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn" hidden>Delete</button>
      <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary" id="saveBtn">Save</button>
    </div>
  </form>
</div>

<div class="scrim" id="importScrim" hidden>
  <form class="sheet" id="importForm" novalidate>
    <h2>Import a bank statement</h2>
    <p class="note">Download your transactions as a CSV file from your bank's website or app, then pick it here. The file is read on this device and never uploaded. PDF statements aren't supported yet.</p>
    <input type="file" id="fFile" class="vh" accept=".csv,text/csv,.txt,text/plain">
    <label class="drop" for="fFile" id="drop"><b>Choose a CSV file</b><span id="fileName">or drop it here</span></label>
    <button type="button" class="linkbtn" id="sampleBtn" style="justify-self:start">Try it with a sample statement</button>
    <div id="importStep" hidden style="display:grid;gap:14px">
      <div class="map">
        <div class="field"><label for="mDate">Date column</label><select id="mDate"></select></div>
        <div class="field"><label for="mDesc">Description column</label><select id="mDesc"></select></div>
        <div class="field"><label for="mAmt">Amount column</label><select id="mAmt"></select></div>
        <div class="field"><label for="mSign">Purchases show as</label>
          <select id="mSign"><option value="neg">Negative (−12)</option><option value="pos">Positive (12)</option></select></div>
        <div class="field"><label for="mOrder">Date format</label>
          <select id="mOrder"><option value="mdy">Month / day</option><option value="dmy">Day / month</option></select></div>
      </div>
      <div class="import-sum" id="importSum"></div>
      <div class="preview" id="preview"></div>
      <label class="check" id="replaceRow"><input type="checkbox" id="fReplace" checked><span>Replace the demo data with my statement</span></label>
    </div>
    <p class="err" id="importErr" hidden></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="importCancel">Cancel</button>
      <button type="submit" class="btn primary" id="importGo" disabled>Import</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  // ---------- Categories & auto-categorizing ----------
  const CATS = [
    { id: 'groceries', name: 'Groceries',     budget: 120 },
    { id: 'dining',    name: 'Eating out',    budget: 60 },
    { id: 'coffee',    name: 'Coffee',        budget: 20 },
    { id: 'transport', name: 'Transport',     budget: 50 },
    { id: 'shopping',  name: 'Shopping',      budget: 70 },
    { id: 'fun',       name: 'Entertainment', budget: 30 },
    { id: 'bills',     name: 'Bills',         budget: 45 },
    { id: 'other',     name: 'Other',         budget: 25 },
  ];
  const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));

  // Checked in order, so "Uber Eats" lands in Eating out before "Uber" hits Transport.
  const RULES = [
    ['dining',    /uber ?eats|doordash|grubhub|deliveroo|pizza|burger|sushi|taco|thai|diner|mcdonald|chipotle|subway|kfc|restaurant|grill|noodle|kebab/i],
    ['coffee',    /coffee|caf[eé]|starbucks|espresso|dunkin|latte|tim hortons|costa/i],
    ['groceries', /grocer|market|trader joe|aldi|lidl|costco|whole foods|supermarket|kroger|safeway|walmart|tesco|woolworths|coles/i],
    ['transport', /uber|lyft|shell|fuel|petrol|\bgas\b|metro|transit|parking|\bbp\b|chevron|train|\bbus\b|taxi/i],
    ['fun',       /netflix|spotify|cinema|movie|steam|concert|bowling|disney|xbox|playstation|ticket|arcade/i],
    ['bills',     /phone|electric|internet|\bgym\b|insurance|rent|water bill|verizon|at&t|utility|mobile plan/i],
    ['shopping',  /amazon|target|h&m|nike|zara|ikea|store|shop|mall|best buy|ebay|uniqlo/i],
  ];
  const guessCat = m => { for (const [c, r] of RULES) if (r.test(m)) return c; return 'other'; };

  // ---------- Dates ----------
  const DAY = 86400000;
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const mondayOf = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const thisMonday = mondayOf(today);
  const weekStart = off => { const x = new Date(thisMonday); x.setDate(x.getDate() + off * 7); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const fmtShort = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const fmtDay = d => d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
  const money = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' });
  const money0 = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  const $ = n => money.format(n);
  const $0 = n => money0.format(Math.round(n));

  // ---------- Fake data ----------
  const HISTORY_WEEKS = 8;
  function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function makeDemo() {
    const rnd = seeded(20261006);
    const pick = a => a[Math.floor(rnd() * a.length)];
    const between = (a, b) => Math.round((a + rnd() * (b - a)) * 100) / 100;
    // perWeek = average number of purchases a week
    const GEN = {
      groceries: { m: ["Trader Joe's", 'Aldi', 'Whole Foods', 'Corner Market'], perWeek: 2.4, a: [22, 68] },
      dining:    { m: ['Pizza Palace', 'Sushi Go', 'Uber Eats', 'Taco Town', 'Burger Joint', 'Thai Orchid'], perWeek: 2.6, a: [11, 34] },
      coffee:    { m: ['Starbucks', 'Bean There Cafe', 'Daily Grind Coffee'], perWeek: 4.6, a: [3.5, 6.8] },
      transport: { m: ['Shell', 'Uber', 'Metro Card', 'City Parking'], perWeek: 2.2, a: [6, 42] },
      shopping:  { m: ['Amazon', 'Target', 'Nike', 'IKEA', 'Uniqlo'], perWeek: 1.1, a: [14, 85] },
      fun:       { m: ['Cinema City', 'Steam', 'Bowling Lanes', 'Arcade Bar'], perWeek: 0.9, a: [8, 40] },
      other:     { m: ['Pharmacy', 'Post Office', 'Hair Salon'], perWeek: 0.5, a: [6, 35] },
    };
    const MONTHLY = [
      { day: 3,  m: 'Mobile Plan',   cat: 'bills', a: [45, 45] },
      { day: 5,  m: 'Electric Co.',  cat: 'bills', a: [38, 64] },
      { day: 10, m: 'Home Internet', cat: 'bills', a: [60, 60] },
      { day: 15, m: 'City Gym',      cat: 'bills', a: [30, 30] },
      { day: 20, m: 'Netflix',       cat: 'fun',   a: [15.49, 15.49] },
      { day: 22, m: 'Spotify',       cat: 'fun',   a: [11.99, 11.99] },
    ];
    const tx = [];
    let id = 1;
    for (let d = weekStart(-(HISTORY_WEEKS - 1)); d <= today; d = addDays(d, 1)) {
      const date = ymd(d);
      for (const [cat, g] of Object.entries(GEN)) {
        let p = g.perWeek / 7;
        while (p > 0) { if (rnd() < Math.min(p, 1)) tx.push({ id: id++, date, merchant: pick(g.m), amount: between(...g.a), cat }); p -= 1; }
      }
      for (const r of MONTHLY) if (d.getDate() === r.day) tx.push({ id: id++, date, merchant: r.m, amount: between(...r.a), cat: r.cat });
    }
    return { tx, budgets: Object.fromEntries(CATS.map(c => [c.id, c.budget])), nextId: id, demo: true };
  }

  // ---------- State (kept in this browser only) ----------
  const KEY = 'piggybank.v1';
  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.tx)) return s; } catch (e) {}
    return makeDemo();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  let data = load();
  let ui = { tab: 'home', week: 0, editing: null };
  try { const t = localStorage.getItem(KEY + '.tab'); if (t) ui.tab = t; } catch (e) {}

  // ---------- Calculations ----------
  const isDemo = () => data.demo !== false;
  const weekOffOf = date => Math.round((mondayOf(parse(date)) - thisMonday) / (7 * DAY));
  // Oldest week you can step back to: 8 weeks, or further if imported purchases go back further.
  function minWeek() {
    const oldest = data.tx.reduce((m, t) => t.date < m ? t.date : m, ymd(today));
    return Math.min(-(HISTORY_WEEKS - 1), weekOffOf(oldest));
  }
  const latestWeek = () => data.tx.length ? Math.min(0, weekOffOf(data.tx.reduce((m, t) => t.date > m ? t.date : m, ''))) : 0;
  function weekTx(off) {
    const s = ymd(weekStart(off)), e = ymd(addDays(weekStart(off), 6));
    return data.tx.filter(t => t.date >= s && t.date <= e);
  }
  function daysElapsed(off) { return off < 0 ? 7 : Math.round((today - weekStart(0)) / DAY) + 1; }
  function summary(off) {
    const list = weekTx(off);
    const byCat = Object.fromEntries(CATS.map(c => [c.id, 0]));
    for (const t of list) byCat[t.cat] = (byCat[t.cat] || 0) + t.amount;
    const total = list.reduce((a, t) => a + t.amount, 0);
    const budget = CATS.reduce((a, c) => a + (+data.budgets[c.id] || 0), 0);
    const days = daysElapsed(off);
    const cats = CATS.map(c => {
      const spent = byCat[c.id], b = +data.budgets[c.id] || 0;
      const projected = days < 7 ? spent / days * 7 : spent;
      let status = 'ok';
      if (spent > b) status = 'over';
      else if (spent >= b * 0.85 || (days < 7 && days >= 3 && projected > b * 1.15)) status = 'warn';
      return { ...c, spent, budget: b, projected, status };
    });
    const projected = days < 7 ? total / days * 7 : total;
    let status = total > budget ? 'over' : (total >= budget * .85 || (days < 7 && days >= 3 && projected > budget * 1.1)) ? 'warn' : 'ok';
    return { list, total, budget, cats, days, projected, status };
  }

  // ---------- Rendering ----------
  const view = document.getElementById('view');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const color = id => `var(--c-${id})`;
  const statusPill = (st, s) => {
    if (st === 'over') return `<span class="pill over">${$0(s.total - s.budget)} over</span>`;
    if (st === 'warn') return `<span class="pill warn">${s.days < 7 && s.total <= s.budget * .85 ? 'Spending fast' : 'Close to limit'}</span>`;
    return `<span class="pill ok">Under budget</span>`;
  };

  // Green until half the budget is used, fades to amber by 85%, then to red at 100% and beyond.
  function meterColor(pct) {
    const mix = (from, to, t) => `color-mix(in oklab, ${to} ${Math.round(t * 100)}%, ${from})`;
    if (pct <= 50) return 'var(--ok)';
    if (pct <= 85) return mix('var(--ok)', 'var(--warn)', (pct - 50) / 35);
    if (pct < 100) return mix('var(--warn)', 'var(--over)', (pct - 85) / 15);
    return 'var(--over)';
  }

  const budgetPct = c => c.budget ? Math.round(c.spent / c.budget * 100) : (c.spent ? 100 : 0);

  function header() {
    const s = weekStart(ui.week), e = addDays(s, 6);
    document.getElementById('weekTitle').textContent = ui.week === 0 ? 'This week' : ui.week === -1 ? 'Last week' : `${-ui.week} weeks ago`;
    document.getElementById('weekRange').textContent = `${fmtShort(s)} – ${fmtShort(e)}`;
    document.getElementById('nextWeek').disabled = ui.week >= 0;
    document.getElementById('prevWeek').disabled = ui.week <= minWeek();
    document.getElementById('demoTag').hidden = !isDemo();
    document.getElementById('weekbar').hidden = ui.tab === 'trends';
    document.querySelectorAll('.tab').forEach(b => b.toggleAttribute('aria-current', b.dataset.tab === ui.tab));
    document.querySelectorAll('.tab[aria-current]').forEach(b => b.setAttribute('aria-current', 'page'));
  }

  function txRow(t) {
    const c = CAT[t.cat] || CAT.other;
    return `<button class="tx" type="button" data-id="${t.id}">
      <span class="tx-ico" style="background:${color(c.id)}">${esc(t.merchant.trim()[0] || '?').toUpperCase()}</span>
      <span class="tx-main"><b>${esc(t.merchant)}</b><span>${c.name}</span></span>
      <span class="tx-amt num">${$(t.amount)}</span>
    </button>`;
  }

  function renderHome() {
    const s = summary(ui.week);
    const pct = s.budget ? s.total / s.budget * 100 : 0;
    const pacePct = s.days / 7 * 100;
    const alerts = s.cats.filter(c => c.status !== 'ok').sort((a, b) => (b.spent - b.budget) - (a.spent - a.budget));
    const spentCats = s.cats.filter(c => c.spent > 0).sort((a, b) => b.spent - a.spent);
    const top = spentCats[0];
    const recent = [...s.list].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0, 4);

    const alertHtml = alerts.map(c => {
      if (c.status === 'over') return `<div class="alert over"><span class="mark">!</span><p><b>${c.name}</b> is ${$0(c.spent - c.budget)} over its ${$0(c.budget)} budget.</p></div>`;
      const msg = c.spent >= c.budget * .85
        ? `has ${$0(c.budget - c.spent)} left of ${$0(c.budget)}.`
        : `is on pace for about ${$0(c.projected)} against a ${$0(c.budget)} budget.`;
      return `<div class="alert warn"><span class="mark">~</span><p><b>${c.name}</b> ${msg}</p></div>`;
    }).join('');

    view.innerHTML = `
      ${isDemo() ? `<div class="banner"><p>You're looking at made-up demo data.</p><button type="button" class="btn primary small" data-action="import">Import my statement</button></div>` : ''}
      <section class="card hero">
        <div class="hero-row"><span class="eyebrow">Spent ${ui.week === 0 ? 'so far' : 'that week'}</span>${statusPill(s.status, s)}</div>
        <div class="big num">${$(s.total)}<span class="of">of ${$0(s.budget)}</span></div>
        <div class="meter" role="img" aria-label="${Math.round(pct)}% of weekly budget used">
          <div class="fill" style="width:${Math.min(pct, 100)}%;background:${meterColor(pct)}"></div>
          ${s.days < 7 ? `<div class="pace" style="left:${pacePct}%" title="Where you'd be spending evenly"></div>` : ''}
        </div>
        <div class="foot num">
          <span>${s.total <= s.budget ? `${$0(s.budget - s.total)} left` : `${$0(s.total - s.budget)} over`}</span>
          <span>${s.days < 7 ? `Day ${s.days} of 7 · on pace for ${$0(s.projected)}` : `${s.list.length} purchases`}</span>
        </div>
      </section>

      ${alerts.length ? `<section class="section"><h2>Watch out<small>${alerts.length} ${alerts.length === 1 ? 'category' : 'categories'}</small></h2><div class="alerts">${alertHtml}</div></section>` : ''}

      <section class="section">
        <h2>Where it went${top ? `<small>Most on ${top.name.toLowerCase()}</small>` : ''}</h2>
        <div class="card cats">
          ${spentCats.length ? spentCats.map(c => `
            <div class="cat-row">
              <span class="cat-name"><i class="dot" style="background:${color(c.id)}"></i>${c.name}</span>
              <span class="cat-amt num">${$(c.spent)}<small>of ${$0(c.budget)} · ${s.total ? Math.round(c.spent / s.total * 100) : 0}% of spending</small></span>
              <div class="bar" role="img" aria-label="${budgetPct(c)}% of ${c.name} budget used"><i style="width:${Math.min(budgetPct(c), 100)}%;background:${meterColor(budgetPct(c))}"></i></div>
            </div>`).join('') : `<div class="empty">No spending this week yet.</div>`}
        </div>
      </section>

      ${recent.length ? `<section class="section">
        <h2>Latest<button class="linkbtn" type="button" data-go="activity">See all</button></h2>
        <div class="card tx-list">${recent.map(txRow).join('')}</div>
      </section>` : ''}`;
  }

  function renderActivity() {
    const s = summary(ui.week);
    const byDay = {};
    for (const t of s.list) (byDay[t.date] ||= []).push(t);
    const days = Object.keys(byDay).sort().reverse();
    view.innerHTML = `
      <section class="section">
        <button type="button" class="card import-cta" data-action="import">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></svg></span>
          <span><b>Import a bank statement</b><span>Add purchases from a CSV file</span></span>
        </button>
        <h2>Purchases<small class="num">${s.list.length} · ${$(s.total)}</small></h2>
        ${days.length ? days.map(d => {
          const list = byDay[d].sort((a, b) => b.id - a.id);
          return `<div class="day">
            <h3><span>${d === ymd(today) ? 'Today' : fmtDay(parse(d))}</span><span class="num">${$(list.reduce((a, t) => a + t.amount, 0))}</span></h3>
            <div class="card tx-list">${list.map(txRow).join('')}</div>
          </div>`;
        }).join('') : `<div class="card empty">Nothing spent this week. Tap + to add a purchase.</div>`}
        <p class="note">Tap a purchase to change its category or delete it.</p>
      </section>`;
  }

  function renderBudgets() {
    const s = summary(ui.week);
    view.innerHTML = `
      <section class="section">
        <h2>Weekly budgets<small>Spent ${ui.week === 0 ? 'this week' : 'that week'}</small></h2>
        <div class="card">
          ${s.cats.map(c => {
            const pct = c.budget ? c.spent / c.budget * 100 : (c.spent ? 100 : 0);
            const barColor = c.status === 'over' ? 'var(--over)' : c.status === 'warn' ? 'var(--warn)' : color(c.id);
            return `<div class="budget-row">
              <div>
                <span class="cat-name"><i class="dot" style="background:${color(c.id)}"></i>${c.name}</span>
                <span class="meta num">${$(c.spent)} spent${c.status === 'over' ? ` · <b style="color:var(--over)">${$0(c.spent - c.budget)} over</b>` : ` · ${$0(Math.max(c.budget - c.spent, 0))} left`}</span>
              </div>
              <label class="budget-input" for="b-${c.id}"><span>$</span><input id="b-${c.id}" class="num" inputmode="numeric" value="${c.budget}" data-budget="${c.id}" aria-label="${c.name} weekly budget"><span>/wk</span></label>
              <div class="bar"><i style="width:${Math.min(pct, 100)}%;background:${barColor}"></i></div>
            </div>`;
          }).join('')}
        </div>
        <div class="card pad totals num"><span>Total weekly budget</span><span id="budgetTotal">${$0(s.budget)}</span></div>
        <p class="note">Bills like rent or your phone plan are monthly, so some weeks they push Bills over. Set the budget to about a quarter of the monthly cost.</p>
      </section>
      <section class="section">
        <h2>Your data</h2>
        <div class="card pad" style="display:grid;gap:10px">
          <p class="note">${isDemo() ? 'Everything here is made up so you can try the app.' : `${data.tx.length} purchases from your statements.`} Your data is saved in this browser only.</p>
          <button type="button" class="btn primary" data-action="import">Import a bank statement</button>
          <div class="actions" id="resetArea"><button type="button" class="btn ghost" id="resetBtn">${isDemo() ? 'Reset demo data' : 'Remove my data and go back to demo'}</button></div>
        </div>
      </section>`;
  }

  function renderTrends() {
    const N = 6;
    const end = latestWeek();
    const weeks = Array.from({ length: N }, (_, i) => { const off = end + i - (N - 1); return { off, ...summary(off) }; });
    const budget = weeks[N - 1].budget;
    const max = Math.max(budget, ...weeks.map(w => w.total)) * 1.1;
    const step = max > 600 ? 200 : max > 300 ? 100 : 50;
    const W = 340, H = 200, L = 40, R = 8, T = 12, B = 28;
    const y = v => T + (H - T - B) * (1 - v / max);
    const bw = (W - L - R) / N;
    let grid = '';
    for (let v = 0; v <= max; v += step) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${$0(v)}</text>`;
    const bars = weeks.map((w, i) => {
      const x = L + i * bw + bw * .18, w2 = bw * .64;
      let acc = 0;
      const segs = w.cats.filter(c => c.spent > 0).map(c => { const y0 = y(acc), y1 = y(acc + c.spent); acc += c.spent; return `<rect x="${x}" y="${y1}" width="${w2}" height="${Math.max(y0 - y1, 0)}" fill="${color(c.id)}"><title>${c.name}: ${$(c.spent)}</title></rect>`; }).join('');
      const label = w.off === 0 ? 'Now' : fmtShort(weekStart(w.off));
      return `${segs}<text x="${x + w2 / 2}" y="${y(w.total) - 5}" text-anchor="middle" style="font-weight:700;fill:${w.total > w.budget ? 'var(--over)' : 'var(--ink)'}">${$0(w.total)}</text><text x="${x + w2 / 2}" y="${H - 8}" text-anchor="middle">${label}</text>`;
    }).join('');
    const budgetLine = `<line x1="${L}" x2="${W - R}" y1="${y(budget)}" y2="${y(budget)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>`;

    const full = weeks.filter(w => w.off < 0);
    if (!full.length) full.push(weeks[N - 1]);
    const avgs = CATS.map(c => {
      const avg = full.reduce((a, w) => a + w.cats.find(x => x.id === c.id).spent, 0) / full.length;
      const overWeeks = full.filter(w => { const x = w.cats.find(k => k.id === c.id); return x.spent > x.budget; }).length;
      return { ...c, avg, budget: +data.budgets[c.id] || 0, overWeeks };
    }).sort((a, b) => b.avg - a.avg);
    const overCount = full.filter(w => w.total > w.budget).length;

    view.innerHTML = `
      <section class="section">
        <h2>Last ${N} weeks<small>Over budget ${overCount} of ${full.length} full weeks</small></h2>
        <div class="card pad chart" style="display:grid;gap:10px">
          <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly spending for the last ${N} weeks">${grid}${budgetLine}${bars}</svg>
          <div class="legend">${CATS.map(c => `<span><i style="background:${color(c.id)}"></i>${c.name}</span>`).join('')}<span><i style="background:none;border-top:2px dashed var(--ink);border-radius:0;height:0"></i>Budget ${$0(budget)}</span></div>
        </div>
      </section>
      <section class="section">
        <h2>Average week<small>Over the last ${full.length} full weeks</small></h2>
        <div class="card" style="overflow-x:auto">
          <table class="avg-table num">
            <thead><tr><th>Category</th><th>Avg</th><th>Budget</th><th>Over</th></tr></thead>
            <tbody>${avgs.map(c => `<tr>
              <td><span class="cat-name"><i class="dot" style="background:${color(c.id)}"></i>${c.name}</span></td>
              <td style="font-weight:700;${c.avg > c.budget ? 'color:var(--over)' : ''}">${$0(c.avg)}</td>
              <td>${$0(c.budget)}</td>
              <td>${c.overWeeks ? `<span class="pill ${c.overWeeks >= 3 ? 'over' : 'warn'}">${c.overWeeks}</span>` : '<span style="color:var(--muted)">0</span>'}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </section>`;
  }

  function render() {
    header();
    ({ home: renderHome, activity: renderActivity, budgets: renderBudgets, trends: renderTrends }[ui.tab] || renderHome)();
  }

  // ---------- Add / edit sheet ----------
  const scrim = document.getElementById('scrim');
  const form = document.getElementById('txForm');
  const fAmount = document.getElementById('fAmount');
  const fMerchant = document.getElementById('fMerchant');
  const fCat = document.getElementById('fCat');
  const fDate = document.getElementById('fDate');
  const guess = document.getElementById('guess');
  const formErr = document.getElementById('formErr');
  fCat.innerHTML = `<option value="auto">Auto</option>` + CATS.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  fDate.max = ymd(today);

  function updateGuess() {
    const m = fMerchant.value.trim();
    guess.innerHTML = fCat.value === 'auto' && m ? `Will go in <b>${CAT[guessCat(m)].name}</b>` : '';
  }
  function openSheet(tx) {
    ui.editing = tx ? tx.id : null;
    document.getElementById('sheetTitle').textContent = tx ? 'Edit purchase' : 'Add a purchase';
    document.getElementById('delBtn').hidden = !tx;
    fAmount.value = tx ? tx.amount.toFixed(2) : '';
    fMerchant.value = tx ? tx.merchant : '';
    fCat.value = tx ? tx.cat : 'auto';
    const wk = weekStart(ui.week);
    fDate.value = tx ? tx.date : ui.week === 0 ? ymd(today) : ymd(addDays(wk, 6));
    formErr.hidden = true;
    updateGuess();
    scrim.hidden = false;
    setTimeout(() => (tx ? fCat : fAmount).focus(), 50);
  }
  function closeSheet() { scrim.hidden = true; ui.editing = null; }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const amount = Math.round(parseFloat(fAmount.value.replace(/[^0-9.]/g, '')) * 100) / 100;
    const merchant = fMerchant.value.trim();
    if (!(amount > 0)) return showErr('Enter an amount above zero.');
    if (!merchant) return showErr('Enter where you spent it.');
    if (!fDate.value) return showErr('Pick a date.');
    const cat = fCat.value === 'auto' ? guessCat(merchant) : fCat.value;
    if (ui.editing) Object.assign(data.tx.find(t => t.id === ui.editing), { amount, merchant, cat, date: fDate.value });
    else data.tx.push({ id: data.nextId++, amount, merchant, cat, date: fDate.value });
    const wasEdit = !!ui.editing;
    // Jump to the week the purchase landed in.
    ui.week = Math.min(0, weekOffOf(fDate.value));
    save(); closeSheet(); render();
    toast(wasEdit ? 'Saved' : `Added to ${CAT[cat].name}`);
  });
  function showErr(msg) { formErr.textContent = msg; formErr.hidden = false; }
  fMerchant.addEventListener('input', updateGuess);
  fCat.addEventListener('change', updateGuess);
  document.getElementById('cancelBtn').addEventListener('click', closeSheet);
  document.getElementById('delBtn').addEventListener('click', () => {
    data.tx = data.tx.filter(t => t.id !== ui.editing);
    save(); closeSheet(); render(); toast('Deleted');
  });
  scrim.addEventListener('click', e => { if (e.target === scrim) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !scrim.hidden) closeSheet(); });

  // ---------- Events ----------
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 1800);
  }
  document.getElementById('addBtn').addEventListener('click', () => openSheet(null));
  document.getElementById('prevWeek').addEventListener('click', () => { ui.week--; render(); });
  document.getElementById('nextWeek').addEventListener('click', () => { ui.week++; render(); });
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
  function go(tab) { ui.tab = tab; try { localStorage.setItem(KEY + '.tab', tab); } catch (e) {} render(); window.scrollTo(0, 0); }

  view.addEventListener('click', e => {
    const tx = e.target.closest('.tx');
    if (tx) return openSheet(data.tx.find(t => t.id === +tx.dataset.id));
    const goBtn = e.target.closest('[data-go]');
    if (goBtn) return go(goBtn.dataset.go);
    if (e.target.id === 'resetBtn') {
      document.getElementById('resetArea').innerHTML = `<button type="button" class="btn ghost" id="resetNo">Keep my changes</button><button type="button" class="btn danger" id="resetYes" style="flex:1">Reset</button>`;
      return;
    }
    if (e.target.closest('[data-action="import"]')) return openImport();
    if (e.target.id === 'resetNo') return render();
    if (e.target.id === 'resetYes') { data = makeDemo(); ui.week = 0; save(); render(); toast('Demo data reset'); }
  });
  view.addEventListener('change', e => {
    const id = e.target.dataset.budget;
    if (!id) return;
    const v = Math.max(0, Math.round(parseFloat(e.target.value) || 0));
    data.budgets[id] = v; save(); render(); toast(`${CAT[id].name} budget set to ${$0(v)}`);
  });

  // ---------- Import a bank statement (CSV, read locally) ----------
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    // Pick the separator used most in the first lines (some banks put account details above the table).
    const head = text.split(/\r?\n/).slice(0, 20).join('\n').replace(/"[^"]*"/g, '');
    const delim = [',', ';', '\t'].sort((a, b) => head.split(b).length - head.split(a).length)[0];
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x));
  }

  function parseAmount(v) {
    if (!v) return NaN;
    let x = v.replace(/[^\d.,()\-+]/g, '');
    const neg = /^\(.*\)$/.test(x) || /-$/.test(x) || /^-/.test(x) || /\bDR\b/i.test(v);
    x = x.replace(/[()\-+]/g, '');
    if (/^\d{1,3}(\.\d{3})*,\d{1,2}$/.test(x) || /^\d+,\d{1,2}$/.test(x)) x = x.replace(/\./g, '').replace(',', '.');
    else x = x.replace(/,/g, '');
    const n = parseFloat(x);
    return isNaN(n) ? NaN : (neg ? -n : n);
  }

  const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  function parseDate(v, order) {
    if (!v) return null;
    let y, m, d, r;
    const yr = n => (n < 100 ? 2000 + n : n);
    if ((r = v.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) [y, m, d] = [+r[1], +r[2], +r[3]];
    else if ((r = v.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})\b/))) {
      [m, d] = order === 'dmy' ? [+r[2], +r[1]] : [+r[1], +r[2]]; y = yr(+r[3]);
    } else if ((r = v.match(/^(\d{1,2})[ -]([A-Za-z]{3})[A-Za-z]*[ -,]*(\d{2,4})/))) [d, m, y] = [+r[1], MONTHS.indexOf(r[2].toLowerCase()) + 1, yr(+r[3])];
    else if ((r = v.match(/^([A-Za-z]{3})[A-Za-z]*\.? (\d{1,2}),? (\d{4})/))) [m, d, y] = [MONTHS.indexOf(r[1].toLowerCase()) + 1, +r[2], +r[3]];
    else return null;
    const dt = new Date(y, m - 1, d);
    if (!m || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
    return ymd(dt);
  }

  // Bank descriptions look like "POS PURCHASE STARBUCKS #10423 SEATTLE WA"; keep the readable part.
  function cleanMerchant(raw) {
    let m = raw.replace(/\s+/g, ' ').trim();
    for (let i = 0; i < 3; i++) m = m.replace(/^(pos|purchase|debit card|debit|card|visa|mastercard|eftpos|contactless|recurring|payment to|direct debit|checkcard|chk card|point of sale|ach|withdrawal)\b[\s:*-]*/i, '');
    m = m.replace(/^(sq|tst|sp|pp|paypal)\s?\*\s?/i, '')
      .replace(/\*\s?[A-Z0-9]{4,}.*$/i, '')
      .replace(/\s*#\s*\d+.*$/, '')
      .replace(/\s+\d{1,2}\/\d{1,2}.*$/, '')
      .replace(/\s+x{2,}\d+.*$/i, '')
      .replace(/\s+\d{4,}.*$/, '')
      .trim();
    if (!m) m = raw.trim();
    if (m === m.toUpperCase()) m = m.toLowerCase().replace(/(^|[\s\-/&])([a-z])/g, (_, a, b) => a + b.toUpperCase());
    return m.slice(0, 40);
  }

  const imp = { rows: [], header: [], body: [], parsed: [] };
  const importScrim = document.getElementById('importScrim');
  const mDate = document.getElementById('mDate'), mDesc = document.getElementById('mDesc'), mAmt = document.getElementById('mAmt');
  const mSign = document.getElementById('mSign'), mOrder = document.getElementById('mOrder');
  const importErr = document.getElementById('importErr'), importGo = document.getElementById('importGo');
  const fFile = document.getElementById('fFile'), drop = document.getElementById('drop');

  function openImport() {
    imp.rows = []; imp.parsed = [];
    fFile.value = '';
    document.getElementById('fileName').textContent = 'or drop it here';
    document.getElementById('importStep').hidden = true;
    document.getElementById('replaceRow').hidden = !isDemo();
    document.getElementById('fReplace').checked = true;
    importErr.hidden = true;
    importGo.disabled = true; importGo.textContent = 'Import';
    importScrim.hidden = false;
  }
  function closeImport() { importScrim.hidden = true; }
  function importError(msg) { importErr.textContent = msg; importErr.hidden = false; document.getElementById('importStep').hidden = true; importGo.disabled = true; }

  function loadCSV(text, name) {
    document.getElementById('fileName').textContent = name;
    importErr.hidden = true;
    const rows = parseCSV(text);
    if (rows.length < 2) return importError("This file doesn't look like a CSV of transactions. Download the CSV (or \"Excel/spreadsheet\") export from your bank and try again.");
    // The header is the first row (within the first 15) that names a date column; banks sometimes put account info above it.
    let h = rows.slice(0, 15).findIndex(r => r.length >= 3 && r.some(c => /date/i.test(c)) && !r.some(c => parseDate(c, 'mdy')));
    const width = Math.max(...rows.map(r => r.length));
    imp.header = h >= 0 ? rows[h].map((c, i) => c || `Column ${i + 1}`) : Array.from({ length: width }, (_, i) => `Column ${i + 1}`);
    imp.body = rows.slice(h + 1).filter(r => r.length >= 2);
    const opts = imp.header.map((c, i) => `<option value="${i}">${esc(c)}</option>`).join('');
    for (const sel of [mDate, mDesc, mAmt]) sel.innerHTML = opts;

    // Guess the columns, first by header name, then by what the cells contain.
    const sample = imp.body.slice(0, 40);
    const share = (i, test) => sample.filter(r => test(r[i] || '')).length / (sample.length || 1);
    const byName = re => imp.header.findIndex(c => re.test(c));
    const best = score => imp.header.map((_, i) => i).sort((a, b) => score(b) - score(a))[0];
    let di = byName(/trans.*date|^date$/i); if (di < 0) di = byName(/date/i);
    if (di < 0 || share(di, v => parseDate(v, 'mdy') || parseDate(v, 'dmy')) < .5) di = best(i => share(i, v => !!(parseDate(v, 'mdy') || parseDate(v, 'dmy'))));
    let ai = imp.header.findIndex(c => /amount|amt|value/i.test(c) && !/balance/i.test(c));
    if (ai < 0) ai = byName(/debit|withdraw|money out|paid out|spent/i);
    if (ai < 0) ai = best(i => i === di ? -1 : share(i, v => /\d[.,]\d{2}\b/.test(v) && !isNaN(parseAmount(v))) - (/balance/i.test(imp.header[i]) ? 1 : 0));
    let ti = byName(/desc|merchant|payee|name|details|memo|narrative|particulars|transaction$/i);
    if (ti < 0 || ti === di || ti === ai) ti = best(i => i === di || i === ai ? -1 : sample.reduce((a, r) => a + (isNaN(parseAmount(r[i])) ? (r[i] || '').length : 0), 0));
    mDate.value = di; mAmt.value = ai; mDesc.value = ti;

    const dates = imp.body.map(r => (r[di] || '').match(/^(\d{1,2})[-/.](\d{1,2})[-/.]\d{2,4}/)).filter(Boolean);
    mOrder.value = dates.some(r => +r[1] > 12) ? 'dmy' : dates.some(r => +r[2] > 12) ? 'mdy' : (navigator.language || 'en-US') === 'en-US' ? 'mdy' : 'dmy';
    const amts = imp.body.map(r => parseAmount(r[ai])).filter(n => !isNaN(n) && n !== 0);
    mSign.value = amts.filter(n => n < 0).length > amts.length / 3 ? 'neg' : 'pos';
    updatePreview();
  }

  function updatePreview() {
    const di = +mDate.value, ti = +mDesc.value, ai = +mAmt.value, order = mOrder.value, sign = mSign.value === 'neg' ? -1 : 1;
    const have = new Set(isDemo() && document.getElementById('fReplace').checked ? [] : data.tx.map(t => `${t.date}|${t.amount}|${t.merchant.toLowerCase()}`));
    let income = 0, transfers = 0, bad = 0, dupes = 0;
    imp.parsed = [];
    for (const r of imp.body) {
      const date = parseDate(r[di], order), raw = r[ti] || '', n = parseAmount(r[ai]);
      // An empty "money out" cell means money came in.
      if (date && raw && !(r[ai] || '').trim()) { income++; continue; }
      if (!date || isNaN(n) || !raw) { bad++; continue; }
      if (n === 0) continue;
      if (Math.sign(n) !== sign) { income++; continue; }
      if (/transfer (to|from)|to savings|from savings|payment.*thank you|autopay payment|credit card payment/i.test(raw)) { transfers++; continue; }
      const merchant = cleanMerchant(raw), amount = Math.round(Math.abs(n) * 100) / 100;
      const key = `${date}|${amount}|${merchant.toLowerCase()}`;
      if (have.has(key)) { dupes++; continue; }
      have.add(key);
      imp.parsed.push({ date, merchant, amount, cat: guessCat(raw + ' ' + merchant) });
    }
    document.getElementById('importStep').hidden = false;
    const p = imp.parsed;
    if (!p.length) {
      document.getElementById('importSum').innerHTML = dupes && !bad ? `All ${dupes} purchases in this file are already added.` : `No purchases found with these settings. Check that the columns are right and try switching <b>Purchases show as</b>.`;
      document.getElementById('preview').innerHTML = '';
      importGo.disabled = true; importGo.textContent = 'Import';
      return;
    }
    const sorted = [...p].sort((a, b) => a.date.localeCompare(b.date));
    const skipped = [income && `${income} ${income === 1 ? 'deposit or refund' : 'deposits or refunds'}`, transfers && `${transfers} ${transfers === 1 ? 'transfer' : 'transfers'} or card payments`, dupes && `${dupes} already added`, bad && `${bad} ${bad === 1 ? 'row' : 'rows'} without a date or amount`].filter(Boolean);
    document.getElementById('importSum').innerHTML = `<b>${p.length} purchases</b> totalling <b class="num">${$(p.reduce((a, t) => a + t.amount, 0))}</b>, ${fmtShort(parse(sorted[0].date))} – ${fmtShort(parse(sorted[sorted.length - 1].date))}.${skipped.length ? `<br><span style="color:var(--muted)">Skipped ${skipped.join(', ')}.</span>` : ''}`;
    const show = [...p].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
    document.getElementById('preview').innerHTML = show.map(t => `<div class="pv">
        <b>${esc(t.merchant)}</b><span class="num" style="font-weight:700">${$(t.amount)}</span>
        <small><i class="dot" style="background:${color(t.cat)}"></i>${CAT[t.cat].name}</small><small class="num">${fmtShort(parse(t.date))}</small>
      </div>`).join('') + (p.length > show.length ? `<div class="more">and ${p.length - show.length} more. You can change any category after importing.</div>` : '');
    importGo.disabled = false;
    importGo.textContent = `Import ${p.length}`;
  }

  function readFile(file) {
    if (!file) return;
    if (/\.pdf$/i.test(file.name) || file.type === 'application/pdf') return importError("PDF statements can't be read yet. Look for a \"Download transactions\" or \"Export\" option in your bank's app or website and choose CSV.");
    if (file.size > 5e6) return importError('That file is over 5 MB. Export a shorter date range and try again.');
    const r = new FileReader();
    r.onload = () => loadCSV(String(r.result), file.name);
    r.onerror = () => importError("Couldn't read that file. Try downloading it again.");
    r.readAsText(file);
  }

  // A made-up checking-account export, in the raw style banks use, dated over the last few weeks.
  function sampleCSV() {
    const lines = ['Transaction Date,Description,Amount,Balance'];
    const items = [
      [1, 'POS PURCHASE STARBUCKS #10423 SEATTLE WA', -5.45], [1, 'SQ *BLUE BOTTLE COFFEE', -6.25], [2, 'TRADER JOES #552 SEATTLE WA', -64.18],
      [3, 'UBER EATS 8005928996 CA', -28.4], [4, 'SHELL OIL 57444212345', -41.07], [5, 'PAYROLL DEPOSIT ACME CO', 1850],
      [5, 'NETFLIX.COM', -15.49], [6, 'CHIPOTLE 1234 SEATTLE WA', -13.85], [7, 'AMAZON MKTPL*2K4L19', -36.99],
      [8, 'ONLINE TRANSFER TO SAVINGS', -200], [8, 'POS PURCHASE STARBUCKS #10423 SEATTLE WA', -4.95], [9, 'VERIZON WIRELESS', -65],
      [10, 'WHOLE FOODS MKT #10234', -52.6], [11, 'LYFT *RIDE SUN 10AM', -18.2], [12, 'CINEMA CITY TICKETS', -24],
      [13, 'TARGET 00012345', -47.32], [14, 'POS PURCHASE STARBUCKS #10423 SEATTLE WA', -5.45], [15, 'PIZZA PALACE', -22.5],
      [16, 'CVS PHARMACY #4521', -12.79], [17, 'TRADER JOES #552 SEATTLE WA', -58.9], [18, 'REFUND AMAZON MKTPL', 19.99],
      [19, 'SQ *BLUE BOTTLE COFFEE', -6.25], [20, 'SHELL OIL 57444212345', -38.6], [21, 'SUSHI GO', -31.2],
      [22, 'CITY GYM MEMBERSHIP', -30], [23, 'SPOTIFY USA', -11.99], [24, 'BURGER JOINT', -16.4], [25, 'ALDI 77812', -44.15],
    ];
    let bal = 2400;
    for (const [ago, desc, amt] of items.reverse()) {
      const d = addDays(today, -(26 - ago));
      bal = Math.round((bal + amt) * 100) / 100;
      lines.push(`${pad(d.getMonth() + 1)}/${pad(d.getDate())}/${d.getFullYear()},"${desc}",${amt.toFixed(2)},${bal.toFixed(2)}`);
    }
    return lines.join('\n');
  }

  fFile.addEventListener('change', () => readFile(fFile.files[0]));
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); readFile(e.dataTransfer.files[0]); });
  document.getElementById('sampleBtn').addEventListener('click', () => loadCSV(sampleCSV(), 'sample-statement.csv'));
  for (const el of [mDate, mDesc, mAmt, mSign, mOrder, document.getElementById('fReplace')]) el.addEventListener('change', updatePreview);
  document.getElementById('importCancel').addEventListener('click', closeImport);
  importScrim.addEventListener('click', e => { if (e.target === importScrim) closeImport(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !importScrim.hidden) closeImport(); });
  document.getElementById('importForm').addEventListener('submit', e => {
    e.preventDefault();
    if (!imp.parsed.length) return;
    const replace = isDemo() && document.getElementById('fReplace').checked;
    if (replace) { data.tx = []; data.nextId = 1; }
    for (const t of imp.parsed) data.tx.push({ id: data.nextId++, ...t });
    if (replace) data.demo = false;
    const n = imp.parsed.length;
    ui.week = Math.max(minWeek(), latestWeek());
    ui.tab = 'activity';
    save(); closeImport(); render(); window.scrollTo(0, 0);
    toast(`Imported ${n} purchases`);
  });

  render();
})();
</script>
